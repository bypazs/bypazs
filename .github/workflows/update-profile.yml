name: Update profile

on:
  push:
    branches: [main]
    paths:
      - "data/cves.yml"
      - "scripts/render.py"
      - "README.md"
      - "banner*.svg"
      - ".markdownlint.yaml"
      - ".github/workflows/update-profile.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate generated profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml==6.0.2
      - name: Check generated output on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/render.py --check
      - name: Validate and render on main
        if: github.event_name != 'pull_request'
        run: python scripts/render.py

  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25
        with:
          globs: README.md

  render:
    name: Render and commit on main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml==6.0.2
      - name: Render
        run: python scripts/render.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- README.md banner*.svg; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md banner*.svg
          git commit -m "chore: render profile from data/cves.yml"
          git push
