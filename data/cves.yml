# Single source of truth for the "Security Research" section.
# Add a new CVE here and push — the "Update profile" workflow rebuilds
# the README tables, the CVE counts and both banners automatically.
#
# Fields
#   id       CVE ID (required)
#   url      advisory or PoC link (required)
#   product  product + version (required)
#   class    vulnerability class, used for the "By class" summary (required)
#   detail   short description shown in the table (required)
#   featured true = shown in the top table with CVSS and role
#   cvss     CVSS score (featured only)
#   role     your credit on the advisory, e.g. Finder / Analyst (featured only)

