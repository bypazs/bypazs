<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">bypazs — Offensive Security Engineer</title>
  <desc id="d">Penetration testing, vulnerability research and secure delivery pipelines. 14 CVEs, OSCP, eWPTX.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .cur  { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- left: identity -->
  <text x="64" y="104" class="mono" font-size="18" fill="#22C55E">~/bypazs $ whoami</text>
  <text x="64" y="166" class="sans" font-size="56" font-weight="800" fill="#F9FAFB">bypazs</text>
  <text x="64" y="208" class="sans" font-size="24" font-weight="600" fill="#D1D5DB">Offensive Security Engineer</text>
  <text x="64" y="244" class="sans" font-size="18" fill="#9CA3AF">Penetration Testing  ·  Vulnerability Research  ·  DevSecOps</text>
  <rect class="cur" x="248" y="88" width="10" height="20" fill="#22C55E"/>

  <!-- right: proof points -->
  <g class="sans" text-anchor="middle">
    <rect x="760" y="86"  width="160" height="128" rx="12" fill="#0F172A" stroke="#1F2937"/>
    <text x="840" y="150" font-size="44" font-weight="800" fill="#22C55E">14</text>
    <text x="840" y="186" font-size="15" fill="#9CA3AF">published CVEs</text>

    <rect x="940" y="86"  width="196" height="58" rx="12" fill="#0F172A" stroke="#1F2937"/>
    <text x="1038" y="122" font-size="18" font-weight="700" fill="#F9FAFB">OSCP · eWPTX</text>

    <rect x="940" y="156" width="196" height="58" rx="12" fill="#0F172A" stroke="#1F2937"/>
    <text x="1038" y="192" font-size="16" font-weight="600" fill="#38BDF8">shift-left security</text>
  </g>
</svg>
